<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0.05" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#53545b"/>
      <stop offset="0.42" stop-color="#3c3d43"/>
      <stop offset="0.78" stop-color="#2c2d31"/>
      <stop offset="1" stop-color="#222327"/>
    </linearGradient>

    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#9a9ba3" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#a9aab2" stop-opacity="0.55"/>
      <stop offset="0.68" stop-color="#7e7f87" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5a5b62" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#1c1d20" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#1e1f22" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#2a2b2f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#33343a" stop-opacity="0"/>
    </linearGradient>

    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0026 0.0042" numOctaves="4" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="320" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="18"/>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.78">
      <stop offset="0.3" stop-color="#0b0c0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0c0e" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <g filter="url(#soft)" opacity="0.8">
    <ellipse cx="280" cy="130" rx="600" ry="320" fill="#65666e"/>
    <ellipse cx="1320" cy="820" rx="640" ry="340" fill="#232428"/>
    <ellipse cx="980" cy="220" rx="420" ry="220" fill="#4b4c53"/>
  </g>

  <g filter="url(#warp)">
    <path d="M-240 150 C 220 10, 540 300, 900 160 S 1420 -20, 1840 140" fill="none" stroke="url(#light)" stroke-width="150" opacity="0.85"/>
    <path d="M-240 330 C 280 190, 600 470, 960 330 S 1460 170, 1840 320" fill="none" stroke="url(#light)" stroke-width="96" opacity="0.7"/>
    <path d="M-240 520 C 240 380, 580 660, 940 520 S 1440 360, 1840 500" fill="none" stroke="url(#dark)" stroke-width="190" opacity="0.9"/>
    <path d="M-240 690 C 320 560, 640 810, 1000 670 S 1470 520, 1840 660" fill="none" stroke="url(#light)" stroke-width="120" opacity="0.45"/>
    <path d="M-240 860 C 260 740, 600 980, 960 840 S 1450 690, 1840 830" fill="none" stroke="url(#dark)" stroke-width="210" opacity="0.8"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
