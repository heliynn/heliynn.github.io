<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0.05" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#3c3d43"/>
      <stop offset="0.42" stop-color="#2a2b30"/>
      <stop offset="0.78" stop-color="#1d1e22"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>

    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7d7e87" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#8b8c95" stop-opacity="0.34"/>
      <stop offset="0.68" stop-color="#5f6068" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#43444a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#0b0c0e" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#0c0d0f" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#17181b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#222327" stop-opacity="0"/>
    </linearGradient>

    <filter id="warp" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0026 0.0042" numOctaves="4" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="320" xChannelSelector="R" yChannelSelector="G" result="warped"/>
      <feGaussianBlur in="warped" stdDeviation="18"/>
    </filter>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.8">
      <stop offset="0.26" stop-color="#070809" stop-opacity="0"/>
      <stop offset="1" stop-color="#070809" stop-opacity="0.7"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>

  <g filter="url(#soft)" opacity="0.75">
    <ellipse cx="800" cy="60" rx="700" ry="300" fill="#565760"/>
    <ellipse cx="260" cy="180" rx="560" ry="300" fill="#3f4046"/>
    <ellipse cx="1330" cy="840" rx="640" ry="340" fill="#101114"/>
    <ellipse cx="980" cy="240" rx="420" ry="220" fill="#33343a"/>
  </g>

  <g filter="url(#warp)">
    <path d="M-240 150 C 220 10, 540 300, 900 160 S 1420 -20, 1840 140" fill="none" stroke="url(#light)" stroke-width="150" opacity="0.7"/>
    <path d="M-240 330 C 280 190, 600 470, 960 330 S 1460 170, 1840 320" fill="none" stroke="url(#light)" stroke-width="96" opacity="0.55"/>
    <path d="M-240 520 C 240 380, 580 660, 940 520 S 1440 360, 1840 500" fill="none" stroke="url(#dark)" stroke-width="190" opacity="0.9"/>
    <path d="M-240 690 C 320 560, 640 810, 1000 670 S 1470 520, 1840 660" fill="none" stroke="url(#light)" stroke-width="120" opacity="0.35"/>
    <path d="M-240 860 C 260 740, 600 980, 960 840 S 1450 690, 1840 830" fill="none" stroke="url(#dark)" stroke-width="210" opacity="0.8"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
