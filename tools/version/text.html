<!DOCTYPE html>
<html lang="en">
<head>

  <title>%%TITLE%%</title>
  <meta name="description" content="%%DESC%%" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta property="og:type" content="website" />

<body data-kind="text" data-source="%%SOURCE%%" data-title="%%DATA_TITLE%%" data-build="%%BUILD%%" data-dumped="%%DUMPED%%">

  <header class="header">

      </div>
    </div>
    <div class="toolbar">
      <input class="search__field" id="search" type="search" placeholder="search lines…" autocomplete="off" spellcheck="false" aria-label="Search %%DATA_TITLE%%" />
    </div>
  </header>

  <main class="page">
    <section class="head">
      <h1>%%H1%%</h1>
      <p class="lede" id="lede">%%LEDE%%</p>
      <div class="actions">%%ACTIONS%%</div>

    %%STAMP%%

    <noscript>
      <p class="status">This page needs JavaScript. Download <a href="%%SOURCE%%">%%SOURCE%%</a> instead.</p>

  </main>

  <script src="%%BASE%%theme.js?v=%%THEME_JS%%"></script>
